name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ⭐️ 모든 로봇들이 자동으로 '260520_practice' 폴더 안에서 실행되도록 최상위에 설정합니다.
defaults:
  run:
    working-directory: 260520_practice

jobs:
  lint:
    name: 1) 린트 검사 (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  security:
    name: 2) 보안 검사 (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm audit

  unit-test:
    name: 3) 단위 테스트 (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:unit  # package.json에 등록된 단위 테스트 명령어로 확인 필요